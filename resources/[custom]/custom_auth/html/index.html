<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purple Havoc — Auth</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app" class="hidden">
        <div class="bg-grid"></div>
        <div class="bg-glow"></div>

        <main class="card" id="card">
            <header class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M24 3l18 10.5v21L24 45 6 34.5v-21L24 3z" stroke="url(#g)" stroke-width="2.5" stroke-linejoin="round"/>
                        <path d="M24 14l10 6v12l-10 6-10-6V20l10-6z" fill="url(#g)" fill-opacity="0.18" stroke="url(#g)" stroke-width="2" stroke-linejoin="round"/>
                        <defs><linearGradient id="g" x1="6" y1="3" x2="42" y2="45" gradientUnits="userSpaceOnUse">
                            <stop stop-color="#b98bff"/><stop offset="1" stop-color="#6d3bff"/>
                        </linearGradient></defs>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>PURPLE HAVOC</h1>
                    <span>RPG Server</span>
                </div>
            </header>

            <nav class="tabs" role="tablist">
                <button class="tab active" data-view="login" role="tab">Login</button>
                <button class="tab" data-view="register" role="tab">Register</button>
                <span class="tab-indicator"></span>
            </nav>

            <!-- LOGIN -->
            <form class="view active" id="view-login" autocomplete="off" novalidate>
                <div class="field">
                    <label for="login-username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="login-username" name="username" placeholder="your's name" spellcheck="false">
                    </div>
                    <p class="hint" data-for="username"></p>
                </div>

                <div class="field">
                    <label for="login-password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="login-password" name="password" placeholder="••••••••">
                        <button type="button" class="toggle-pass" data-target="login-password" aria-label="Show password">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <p class="hint" data-for="password"></p>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-login">
                    <span class="btn-label">Login</span>
                    <span class="spinner"></span>
                </button>
                <button type="button" class="btn btn-ghost" id="btn-quit">Quit</button>
            </form>

            <!-- REGISTER -->
            <form class="view" id="view-register" autocomplete="off" novalidate>
                <div class="field">
                    <label for="reg-username">Username</label>
                    <div class="input-wrap">
                        <input type="text" id="reg-username" name="username" placeholder="3-24 characters" spellcheck="false">
                    </div>
                    <p class="hint" data-for="username"></p>
                </div>

                <div class="field">
                    <label for="reg-email">Email</label>
                    <div class="input-wrap">
                        <input type="email" id="reg-email" name="email" placeholder="test@exemplu.com" spellcheck="false">
                    </div>
                    <p class="hint" data-for="email"></p>
                </div>

                <div class="field">
                    <label for="reg-password">Password</label>
                    <div class="input-wrap">
                        <input type="password" id="reg-password" name="password" placeholder="min. 6 characters">
                        <button type="button" class="toggle-pass" data-target="reg-password" aria-label="Show password">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                    <div class="strength"><span></span><span></span><span></span><span></span></div>
                    <p class="hint" data-for="password"></p>
                </div>

                <div class="field">
                    <label for="reg-confirm">Confirm Password</label>
                    <div class="input-wrap">
                        <input type="password" id="reg-confirm" name="confirmPassword" placeholder="••••••••">
                    </div>
                    <p class="hint" data-for="confirmPassword"></p>
                </div>

                <button type="submit" class="btn btn-primary" id="btn-register">
                    <span class="btn-label">Register</span>
                    <span class="spinner"></span>
                </button>
            </form>

            <div class="toast" id="toast"></div>

            <footer class="foot">
                <span>Developed by: BabyAdy</span>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
